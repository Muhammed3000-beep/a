<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>e-Okul · Anlık Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1220;--panel:#111827;--card:#1a2332;--line:#2a3548;
  --text:#e8eef7;--muted:#94a3b8;--primary:#3b82f6;--primary2:#60a5fa;
  --ok:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;line-height:1.45}
button,input,select,textarea{font:inherit}
.hidden{display:none!important}
#boot{min-height:100dvh;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.9rem}
#loginView{
  min-height:100dvh;display:none;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(ellipse 80% 50% at 50% -20%,rgba(59,130,246,.22),transparent 55%);
}
.login-card{
  width:min(440px,100%);background:var(--panel);border:1px solid var(--line);
  border-radius:20px;padding:28px 24px;box-shadow:0 24px 60px rgba(0,0,0,.4);
}
.login-card h1{font-size:1.35rem;font-weight:800;margin-bottom:4px}
.login-card .sub{color:var(--muted);font-size:.85rem;margin-bottom:16px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tab{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--muted);font-weight:700;font-size:.8rem;cursor:pointer}
.tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.field{margin-bottom:11px}
.field label{display:block;font-size:.72rem;font-weight:600;color:var(--muted);margin-bottom:5px}
.field input,.field select,textarea{
  width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);
  background:#0d1524;color:var(--text);outline:none;
}
.field input:focus,.field select:focus,textarea:focus{border-color:var(--primary)}
.btn{
  border:0;cursor:pointer;border-radius:10px;padding:11px 16px;font-weight:700;font-size:.88rem;
  background:var(--primary);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:6px;
}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.5;cursor:wait}
.btn-block{width:100%}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.btn-ok{background:var(--ok)}
.btn-warn{background:var(--warn);color:#111}
.btn-danger{background:var(--danger)}
.btn-sm{padding:7px 11px;font-size:.75rem}
.alert{padding:10px;border-radius:10px;font-size:.8rem;margin-bottom:12px;border:1px solid}
.alert-err{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.35);color:#fca5a5}
.alert-ok{background:rgba(34,197,94,.12);border-color:rgba(34,197,94,.35);color:#86efac}
.hint{margin-top:12px;padding:10px 12px;background:#0d1524;border-radius:10px;font-size:.74rem;color:var(--muted);line-height:1.55}
.hint code{color:var(--primary2)}

#appView{display:none;min-height:100dvh}
.top{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px 16px;background:rgba(11,18,32,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
}
.brand{font-weight:800;font-size:1.05rem}
.brand span{color:var(--primary2);font-weight:600;font-size:.72rem;margin-left:6px}
.user-meta{font-size:.78rem;color:var(--muted);text-align:right}
.user-meta strong{display:block;color:var(--text);font-size:.85rem}
.layout{display:grid;grid-template-columns:210px 1fr;min-height:calc(100dvh - 58px)}
@media(max-width:820px){
  .layout{grid-template-columns:1fr}
  .side{display:none}
  .side.open{display:block;position:fixed;inset:58px 0 auto 0;z-index:30;background:var(--panel);border-bottom:1px solid var(--line);max-height:55vh;overflow:auto}
  .menu-toggle{display:inline-flex!important}
}
.side{background:var(--panel);border-right:1px solid var(--line);padding:12px}
.nav-btn{
  display:block;width:100%;text-align:left;padding:10px 12px;margin-bottom:4px;border:0;border-radius:10px;
  background:transparent;color:var(--muted);font-weight:600;font-size:.84rem;cursor:pointer;
}
.nav-btn:hover,.nav-btn.active{background:#1e293b;color:var(--text)}
.main{padding:16px;max-width:1100px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.stat .n{font-size:1.45rem;font-weight:800}
.stat .l{font-size:.7rem;color:var(--muted);margin-top:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.card h2{font-size:.98rem;font-weight:700;margin-bottom:12px}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;font-size:.82rem}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--muted);font-weight:600;font-size:.7rem;text-transform:uppercase;letter-spacing:.04em}
.form-row{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));margin-bottom:10px}
.badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:.68rem;font-weight:700}
.b-ozurlu{background:rgba(34,197,94,.15);color:#86efac}
.b-ozursuz{background:rgba(239,68,68,.15);color:#fca5a5}
.b-bekle{background:rgba(245,158,11,.15);color:#fcd34d}
.b-var{background:rgba(59,130,246,.15);color:#93c5fd}
.empty{color:var(--muted);font-size:.85rem;padding:8px 0}
.menu-toggle{display:none;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:8px 10px}
.live{display:inline-flex;align-items:center;gap:6px;font-size:.7rem;color:var(--ok);font-weight:600}
.live i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);animation:p 1.4s infinite}
@keyframes p{50%{opacity:.35}}
.row-actions{display:flex;gap:6px;flex-wrap:wrap}
</style>
</head>
<body>
<div id="boot">Firebase bağlanıyor…</div>

<div id="loginView">
  <div class="login-card">
    <h1>e-Okul</h1>
    <p class="sub">Yönetim · Öğretmen · VBS (veli / öğrenci)</p>
    <div class="tabs">
      <button type="button" class="tab active" data-mode="staff">Yönetim / Öğretmen</button>
      <button type="button" class="tab" data-mode="vbs">VBS Giriş</button>
    </div>
    <div id="loginAlert" class="alert alert-err hidden"></div>

    <form id="staffForm">
      <div class="field"><label>Kullanıcı adı</label><input id="staffUser" required autocomplete="username"></div>
      <div class="field"><label>Şifre</label><input id="staffPass" type="password" required autocomplete="current-password"></div>
      <button class="btn btn-block" type="submit">Giriş yap</button>
    </form>

    <form id="vbsForm" class="hidden">
      <div class="field"><label>Ad Soyad</label><input id="vbsName" required placeholder="Örn. Mehmet Demir"></div>
      <div class="field"><label>Sınıf / Şube</label>
        <select id="vbsClass" required></select>
      </div>
      <div class="field"><label>Okul numarası</label><input id="vbsNo" required placeholder="Örn. 142"></div>
      <button class="btn btn-block" type="submit">VBS Giriş</button>
    </form>

    <div class="hint">
      <strong style="color:var(--text)">İlk açılışta “Demo veriyi kur” (yönetici menüsü)</strong><br>
      Yönetici: <code>admin</code> / <code>admin123</code><br>
      Öğretmen: <code>ogretmen</code> / <code>ogretmen123</code><br>
      VBS: demo öğrenciler (Ad + Sınıf + No)
    </div>
  </div>
</div>

<div id="appView">
  <header class="top">
    <div style="display:flex;align-items:center;gap:10px">
      <button type="button" class="menu-toggle" id="menuToggle">Menü</button>
      <div class="brand">e-Okul <span id="roleLabel"></span></div>
    </div>
    <div style="display:flex;align-items:center;gap:12px">
      <span class="live"><i></i> Anlık</span>
      <div class="user-meta"><strong id="userName">—</strong><span id="userExtra"></span></div>
      <button type="button" class="btn btn-ghost btn-sm" id="logoutBtn">Çıkış</button>
    </div>
  </header>
  <div class="layout">
    <aside class="side" id="sideNav"></aside>
    <main class="main" id="mainArea"></main>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import {
  getFirestore, collection, doc, setDoc, getDoc, getDocs, addDoc, updateDoc, deleteDoc,
  onSnapshot, query, where, serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAnmGzhkJEfxKNcvLDRilXP-iQc3lMMLrc",
  authDomain: "sisteym-14312.firebaseapp.com",
  projectId: "sisteym-14312",
  storageBucket: "sisteym-14312.firebasestorage.app",
  messagingSenderId: "498532288088",
  appId: "1:498532288088:web:8d47ef5533f4c9ac946c2d"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const EXAM_TYPES = ["Sözlü", "Sınav", "Yazılı", "Performans", "Proje", "Ödev notu"];
const SESSION_KEY = "EOKUL_FB_SESSION";

let current = null;
let page = "dashboard";
let unsubs = [];
let cache = { students: [], teachers: [], classes: [], grades: [], attendance: [], announcements: [] };

const boot = document.getElementById("boot");
const loginView = document.getElementById("loginView");
const appView = document.getElementById("appView");
const sideNav = document.getElementById("sideNav");
const mainArea = document.getElementById("mainArea");

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
}
function val(id){ const el=document.getElementById(id); return el ? (el.value||"").trim() : ""; }
function today(){ return new Date().toISOString().slice(0,10); }
function clearUnsubs(){ unsubs.forEach(u=>{ try{u()}catch{} }); unsubs=[]; }

function setAlert(msg, ok){
  const a=document.getElementById("loginAlert");
  a.className="alert "+(ok?"alert-ok":"alert-err");
  a.textContent=msg;
  a.classList.remove("hidden");
}

function getSession(){
  try{ return JSON.parse(sessionStorage.getItem(SESSION_KEY)||"null"); }catch{ return null; }
}
function setSession(u){
  if(!u) sessionStorage.removeItem(SESSION_KEY);
  else sessionStorage.setItem(SESSION_KEY, JSON.stringify(u));
}

/* ——— Seed demo ——— */
async function seedDemo(){
  // classes
  const classes = [
    { id:"9A", name:"9-A", grade:9 },
    { id:"9B", name:"9-B", grade:9 },
    { id:"10A", name:"10-A", grade:10 }
  ];
  for(const c of classes) await setDoc(doc(db,"classes",c.id), c);

  // staff
  await setDoc(doc(db,"staff","admin"), {
    username:"admin", pass:"admin123", role:"admin", name:"Sistem Yöneticisi"
  });
  await setDoc(doc(db,"staff","ogretmen"), {
    username:"ogretmen", pass:"ogretmen123", role:"teacher", name:"Ayşe Yılmaz", branch:"Matematik"
  });
  await setDoc(doc(db,"staff","ogretmen2"), {
    username:"fen", pass:"fen123", role:"teacher", name:"Can Öztürk", branch:"Fen Bilimleri"
  });

  // students (VBS: name + classId + number)
  const students = [
    { id:"s1", name:"Mehmet Demir", classId:"9A", number:"101" },
    { id:"s2", name:"Elif Kaya", classId:"9A", number:"102" },
    { id:"s3", name:"Ali Vural", classId:"9A", number:"103" },
    { id:"s4", name:"Zeynep Ak", classId:"9B", number:"201" },
    { id:"s5", name:"Burak Şahin", classId:"9B", number:"202" },
    { id:"s6", name:"Deniz Yıldız", classId:"10A", number:"301" }
  ];
  for(const s of students) await setDoc(doc(db,"students",s.id), s);

  await addDoc(collection(db,"announcements"), {
    title:"Hoş geldiniz",
    text:"e-Okul anlık paneli aktif. VBS girişi: Ad Soyad + Sınıf + Numara.",
    date: today(),
    by:"admin",
    createdAt: serverTimestamp()
  });

  alert("Demo veri kuruldu.\n\nYönetici: admin / admin123\nÖğretmen: ogretmen / ogretmen123\nVBS örnek: Mehmet Demir · 9-A · 101");
}

/* ——— Auth ——— */
async function loginStaff(username, pass){
  const snap = await getDoc(doc(db,"staff", username));
  if(!snap.exists()) throw new Error("Kullanıcı bulunamadı");
  const d = snap.data();
  if(d.pass !== pass) throw new Error("Şifre hatalı");
  return { id: snap.id, role: d.role, name: d.name, branch: d.branch||"", username: d.username };
}

async function loginVbs(name, classId, number){
  const qy = query(
    collection(db,"students"),
    where("classId","==", classId),
    where("number","==", number)
  );
  const snap = await getDocs(qy);
  let found = null;
  snap.forEach(d=>{
    const x=d.data();
    if(String(x.name||"").trim().toLocaleLowerCase("tr-TR") === name.trim().toLocaleLowerCase("tr-TR")){
      found = { id:d.id, ...x, role:"student" };
    }
  });
  if(!found) throw new Error("Öğrenci bulunamadı. Ad soyad, sınıf ve numarayı kontrol edin.");
  return found;
}

async function loadClassesToSelect(selId){
  const sel=document.getElementById(selId);
  if(!sel) return;
  const snap=await getDocs(collection(db,"classes"));
  const rows=[];
  snap.forEach(d=>rows.push({id:d.id, ...d.data()}));
  rows.sort((a,b)=>String(a.name).localeCompare(String(b.name),"tr"));
  sel.innerHTML = rows.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join("") || `<option value="">Sınıf yok</option>`;
}

/* ——— UI shell ——— */
function showLogin(){
  clearUnsubs();
  current=null;
  boot.classList.add("hidden");
  appView.style.display="none";
  loginView.style.display="flex";
  loadClassesToSelect("vbsClass");
}

function showApp(){
  boot.classList.add("hidden");
  loginView.style.display="none";
  appView.style.display="block";
  document.getElementById("userName").textContent = current.name;
  document.getElementById("roleLabel").textContent =
    current.role==="admin" ? "· Yönetim" : current.role==="teacher" ? "· Öğretmen" : "· VBS";
  document.getElementById("userExtra").textContent =
    current.role==="teacher" ? (current.branch||"Öğretmen") :
    current.role==="student" ? (`No ${current.number} · ${classLabel(current.classId)}`) :
    "Yönetici";
  renderNav();
  startListeners();
  renderPage();
}

function classLabel(id){
  const c=cache.classes.find(x=>x.id===id);
  return c ? c.name : id;
}

function renderNav(){
  const items = {
    admin: [
      ["dashboard","Özet"],
      ["attendanceAdmin","Devamsızlık onayı"],
      ["students","Öğrenciler"],
      ["teachers","Öğretmenler"],
      ["classes","Sınıflar"],
      ["announcements","Duyurular"],
      ["seed","Demo veriyi kur"]
    ],
    teacher: [
      ["dashboard","Özet"],
      ["grades","Not gir"],
      ["attendance","Yoklama"],
      ["announcements","Duyurular"]
    ],
    student: [
      ["dashboard","Özet / Ortalama"],
      ["myGrades","Notlarım"],
      ["myAttendance","Devamsızlık"],
      ["announcements","Duyurular"]
    ]
  };
  const list = items[current.role] || [];
  sideNav.innerHTML = list.map(([id,label]) =>
    `<button type="button" class="nav-btn ${page===id?"active":""}" data-page="${id}">${label}</button>`
  ).join("");
  sideNav.querySelectorAll(".nav-btn").forEach(btn=>{
    btn.onclick = () => {
      page = btn.getAttribute("data-page");
      sideNav.classList.remove("open");
      renderNav();
      renderPage();
    };
  });
}

function startListeners(){
  clearUnsubs();
  unsubs.push(onSnapshot(collection(db,"students"), snap=>{
    cache.students=[]; snap.forEach(d=>cache.students.push({id:d.id, ...d.data()}));
    if(current) renderPage();
  }));
  unsubs.push(onSnapshot(collection(db,"staff"), snap=>{
    cache.teachers=[]; snap.forEach(d=>{ const x=d.data(); if(x.role==="teacher") cache.teachers.push({id:d.id, ...x}); });
    if(current) renderPage();
  }));
  unsubs.push(onSnapshot(collection(db,"classes"), snap=>{
    cache.classes=[]; snap.forEach(d=>cache.classes.push({id:d.id, ...d.data()}));
    cache.classes.sort((a,b)=>String(a.name).localeCompare(String(b.name),"tr"));
    if(current) renderPage();
  }));
  unsubs.push(onSnapshot(collection(db,"grades"), snap=>{
    cache.grades=[]; snap.forEach(d=>cache.grades.push({id:d.id, ...d.data()}));
    if(current) renderPage();
  }));
  unsubs.push(onSnapshot(collection(db,"attendance"), snap=>{
    cache.attendance=[]; snap.forEach(d=>cache.attendance.push({id:d.id, ...d.data()}));
    if(current) renderPage();
  }));
  unsubs.push(onSnapshot(collection(db,"announcements"), snap=>{
    cache.announcements=[]; snap.forEach(d=>cache.announcements.push({id:d.id, ...d.data()}));
    cache.announcements.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    if(current) renderPage();
  }));
}

/* ——— Pages ——— */
function renderPage(){
  if(!current) return;
  if(current.role==="admin") renderAdmin();
  else if(current.role==="teacher") renderTeacher();
  else renderStudent();
}

function renderAdmin(){
  if(page==="dashboard"){
    const pending = cache.attendance.filter(a=>a.status==="yok" && a.review==="pending").length;
    mainArea.innerHTML = `
      <div class="grid">
        <div class="stat"><div class="n">${cache.students.length}</div><div class="l">Öğrenci</div></div>
        <div class="stat"><div class="n">${cache.teachers.length}</div><div class="l">Öğretmen</div></div>
        <div class="stat"><div class="n">${cache.classes.length}</div><div class="l">Sınıf</div></div>
        <div class="stat"><div class="n">${pending}</div><div class="l">Onay bekleyen yoklama</div></div>
      </div>
      <div class="card"><h2>Yönetim</h2>
        <p class="empty">Öğretmen yoklamalarını <strong>özürlü / özürsüz</strong> olarak onaylayıp VBS’ye yansıtın. Notlar öğretmen kaydıyla anlık görünür.</p>
      </div>`;
  }
  else if(page==="attendanceAdmin"){
    const rows = cache.attendance
      .filter(a => a.status === "yok" || a.status === "gec")
      .slice()
      .sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    mainArea.innerHTML = `
      <div class="card"><h2>Devamsızlık onayı → VBS</h2>
        <p class="empty" style="margin-bottom:12px">Öğretmenden gelen yok kayıtlarını özürlü veya özürsüz işaretleyin. Sonuç anlık VBS’te görünür.</p>
        <div class="table-wrap"><table>
          <thead><tr><th>Tarih</th><th>Öğrenci</th><th>Sınıf</th><th>Durum</th><th>İnceleme</th><th>İşlem</th></tr></thead>
          <tbody>
          ${rows.map(a=>{
            const st=cache.students.find(s=>s.id===a.studentId);
            const rev=a.review||"pending";
            return `<tr>
              <td>${esc(a.date)}</td>
              <td>${esc(st?st.name:"—")}</td>
              <td>${esc(st?classLabel(st.classId):"")}</td>
              <td>${esc(a.status)}</td>
              <td>${rev==="ozurlu"?`<span class="badge b-ozurlu">Özürlü</span>`:
                   rev==="ozursuz"?`<span class="badge b-ozursuz">Özürsüz</span>`:
                   `<span class="badge b-bekle">Bekliyor</span>`}</td>
              <td class="row-actions">
                <button type="button" class="btn btn-ok btn-sm" data-id="${a.id}" data-rev="ozurlu">Özürlü</button>
                <button type="button" class="btn btn-danger btn-sm" data-id="${a.id}" data-rev="ozursuz">Özürsüz</button>
              </td>
            </tr>`;
          }).join("") || `<tr><td colspan="6" class="empty">Kayıt yok</td></tr>`}
          </tbody>
        </table></div>
      </div>`;
    mainArea.querySelectorAll("[data-rev]").forEach(btn=>{
      btn.onclick = async () => {
        btn.disabled = true;
        try{
          await updateDoc(doc(db,"attendance", btn.getAttribute("data-id")), {
            review: btn.getAttribute("data-rev"),
            reviewedAt: serverTimestamp(),
            reviewedBy: current.username
          });
        }catch(e){ alert(e.message||e); btn.disabled=false; }
      };
    });
  }
  else if(page==="students"){
    mainArea.innerHTML = `
      <div class="card"><h2>Öğrenci ekle (VBS)</h2>
        <div class="form-row">
          <div class="field"><label>Ad Soyad</label><input id="sName"></div>
          <div class="field"><label>Numara</label><input id="sNo"></div>
          <div class="field"><label>Sınıf</label>
            <select id="sClass">${cache.classes.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join("")}</select>
          </div>
        </div>
        <button type="button" class="btn btn-sm" id="addStudent">Ekle</button>
      </div>
      <div class="card"><h2>Öğrenciler</h2>
        <div class="table-wrap"><table><thead><tr><th>Ad Soyad</th><th>No</th><th>Sınıf</th><th></th></tr></thead>
        <tbody>${cache.students.map(s=>`<tr>
          <td>${esc(s.name)}</td><td>${esc(s.number)}</td><td>${esc(classLabel(s.classId))}</td>
          <td><button type="button" class="btn btn-ghost btn-sm" data-del="${s.id}">Sil</button></td>
        </tr>`).join("")||`<tr><td colspan="4" class="empty">Öğrenci yok — Demo veriyi kur</td></tr>`}
        </tbody></table></div>
      </div>`;
    document.getElementById("addStudent").onclick = async () => {
      const name=val("sName"), number=val("sNo"), classId=val("sClass");
      if(!name||!number||!classId) return alert("Tüm alanlar gerekli");
      try{
        await addDoc(collection(db,"students"), { name, number, classId });
        document.getElementById("sName").value="";
        document.getElementById("sNo").value="";
      }catch(e){ alert(e.message||e); }
    };
    mainArea.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{
      if(!confirm("Silinsin mi?")) return;
      await deleteDoc(doc(db,"students", b.getAttribute("data-del")));
    });
  }
  else if(page==="teachers"){
    mainArea.innerHTML = `
      <div class="card"><h2>Öğretmen ekle</h2>
        <div class="form-row">
          <div class="field"><label>Ad Soyad</label><input id="tName"></div>
          <div class="field"><label>Kullanıcı adı</label><input id="tUser"></div>
          <div class="field"><label>Şifre</label><input id="tPass" value="123456"></div>
          <div class="field"><label>Branş</label><input id="tBranch"></div>
        </div>
        <button type="button" class="btn btn-sm" id="addTeacher">Ekle</button>
      </div>
      <div class="card"><h2>Öğretmenler</h2>
        <div class="table-wrap"><table><thead><tr><th>Ad</th><th>Kullanıcı</th><th>Branş</th></tr></thead>
        <tbody>${cache.teachers.map(t=>`<tr>
          <td>${esc(t.name)}</td><td>${esc(t.username)}</td><td>${esc(t.branch||"")}</td>
        </tr>`).join("")||`<tr><td colspan="3" class="empty">Yok</td></tr>`}
        </tbody></table></div>
      </div>`;
    document.getElementById("addTeacher").onclick = async () => {
      const name=val("tName"), username=val("tUser"), pass=val("tPass")||"123456", branch=val("tBranch");
      if(!name||!username) return alert("Ad ve kullanıcı adı gerekli");
      try{
        await setDoc(doc(db,"staff", username), { username, pass, role:"teacher", name, branch });
        alert("Öğretmen eklendi");
      }catch(e){ alert(e.message||e); }
    };
  }
  else if(page==="classes"){
    mainArea.innerHTML = `
      <div class="card"><h2>Sınıf ekle</h2>
        <div class="form-row">
          <div class="field"><label>Kod (örn. 9A)</label><input id="cId" placeholder="9A"></div>
          <div class="field"><label>Görünen ad</label><input id="cName" placeholder="9-A"></div>
          <div class="field"><label>Kademe</label><input id="cGrade" type="number" value="9"></div>
        </div>
        <button type="button" class="btn btn-sm" id="addClass">Ekle</button>
      </div>
      <div class="card"><h2>Sınıflar</h2>
        <div class="table-wrap"><table><thead><tr><th>Kod</th><th>Ad</th><th>Kademe</th></tr></thead>
        <tbody>${cache.classes.map(c=>`<tr><td>${esc(c.id)}</td><td>${esc(c.name)}</td><td>${esc(c.grade)}</td></tr>`).join("")}
        </tbody></table></div>
      </div>`;
    document.getElementById("addClass").onclick = async () => {
      const id=val("cId").replace(/\s/g,""), name=val("cName"), grade=Number(val("cGrade"))||9;
      if(!id||!name) return alert("Kod ve ad gerekli");
      await setDoc(doc(db,"classes", id), { id, name, grade });
    };
  }
  else if(page==="announcements") renderAnnouncements(true);
  else if(page==="seed"){
    mainArea.innerHTML = `
      <div class="card"><h2>Demo veriyi kur</h2>
        <p class="empty">Firestore’a örnek sınıf, öğrenci, yönetici ve öğretmen yazar. Mevcut aynı id’ler üzerine yazar.</p>
        <button type="button" class="btn" id="doSeed" style="margin-top:12px">Demo veriyi kur</button>
      </div>`;
    document.getElementById("doSeed").onclick = async () => {
      const b=document.getElementById("doSeed"); b.disabled=true; b.textContent="Kuruluyor…";
      try{ await seedDemo(); }catch(e){ alert("Hata: "+(e.message||e)+"\n\nFirestore Rules’ı test modunda açmanız gerekebilir."); }
      b.disabled=false; b.textContent="Demo veriyi kur";
    };
  }
}

function renderTeacher(){
  if(page==="dashboard"){
    mainArea.innerHTML = `
      <div class="card"><h2>Hoş geldiniz, ${esc(current.name)}</h2>
        <p class="empty">Branş: ${esc(current.branch||"—")}. Sınıf seçip not girin veya yoklama alın. Kayıtlar anlık VBS’ye düşer.</p>
      </div>`;
  }
  else if(page==="grades"){
    const classOpts = cache.classes.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join("");
    const typeOpts = EXAM_TYPES.map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join("");
    mainArea.innerHTML = `
      <div class="card"><h2>Not gir (anlık VBS)</h2>
        <div class="form-row">
          <div class="field"><label>Sınıf / şube</label><select id="gClass">${classOpts}</select></div>
          <div class="field"><label>Ders adı</label><input id="gLesson" placeholder="Matematik" value="${esc(current.branch||"Matematik")}"></div>
          <div class="field"><label>Not türü</label><select id="gType">${typeOpts}</select></div>
          <div class="field"><label>Tarih</label><input id="gDate" type="date" value="${today()}"></div>
        </div>
        <div id="gradeStudentList"></div>
        <button type="button" class="btn" id="saveGrades" style="margin-top:12px">Seçili notları gönder</button>
      </div>
      <div class="card"><h2>Son girilen notlar</h2>
        <div class="table-wrap"><table><thead><tr><th>Öğrenci</th><th>Ders</th><th>Tür</th><th>Not</th><th>Tarih</th></tr></thead>
        <tbody>${cache.grades.slice().reverse().slice(0,25).map(g=>{
          const st=cache.students.find(s=>s.id===g.studentId);
          return `<tr><td>${esc(st?st.name:"—")}</td><td>${esc(g.lesson)}</td><td>${esc(g.type)}</td><td><strong>${g.score}</strong></td><td>${esc(g.date||"")}</td></tr>`;
        }).join("")||`<tr><td colspan="5" class="empty">Henüz not yok</td></tr>`}
        </tbody></table></div>
      </div>`;

    function drawGradeStudents(){
      const cid=val("gClass");
      const list=cache.students.filter(s=>s.classId===cid);
      document.getElementById("gradeStudentList").innerHTML = list.length ? `
        <div class="table-wrap" style="margin-top:8px"><table>
          <thead><tr><th>Öğrenci</th><th>No</th><th>Not (0-100)</th></tr></thead>
          <tbody>${list.map(s=>`<tr>
            <td>${esc(s.name)}</td><td>${esc(s.number)}</td>
            <td><input type="number" min="0" max="100" data-sid="${s.id}" placeholder="—" style="width:90px;padding:8px;border-radius:8px;border:1px solid var(--line);background:#0d1524;color:var(--text)"></td>
          </tr>`).join("")}</tbody>
        </table></div>` : `<p class="empty">Bu sınıfta öğrenci yok</p>`;
    }
    document.getElementById("gClass").onchange = drawGradeStudents;
    drawGradeStudents();

    document.getElementById("saveGrades").onclick = async () => {
      const lesson=val("gLesson"), type=val("gType"), date=val("gDate")||today();
      if(!lesson) return alert("Ders adı gerekli");
      const inputs=[...document.querySelectorAll("#gradeStudentList input[data-sid]")];
      const rows=inputs.map(inp=>({ studentId: inp.getAttribute("data-sid"), score: inp.value.trim() }))
        .filter(r=>r.score!=="" && !isNaN(Number(r.score)));
      if(!rows.length) return alert("En az bir öğrenciye not yazın");
      const btn=document.getElementById("saveGrades");
      btn.disabled=true; btn.textContent="Gönderiliyor…";
      try{
        for(const r of rows){
          const score=Math.max(0, Math.min(100, Number(r.score)));
          await addDoc(collection(db,"grades"), {
            studentId: r.studentId,
            lesson, type, score, date,
            teacherId: current.id,
            teacherName: current.name,
            createdAt: serverTimestamp()
          });
        }
        alert(rows.length + " not VBS’ye gönderildi (anlık).");
        drawGradeStudents();
      }catch(e){ alert(e.message||e); }
      btn.disabled=false; btn.textContent="Seçili notları gönder";
    };
  }
  else if(page==="attendance"){
    const classOpts = cache.classes.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join("");
    mainArea.innerHTML = `
      <div class="card"><h2>Yoklama al</h2>
        <div class="form-row">
          <div class="field"><label>Sınıf / şube</label><select id="aClass">${classOpts}</select></div>
          <div class="field"><label>Tarih</label><input id="aDate" type="date" value="${today()}"></div>
        </div>
        <div id="attList"></div>
        <button type="button" class="btn" id="saveAtt" style="margin-top:12px">Yoklamayı kaydet</button>
        <p class="empty" style="margin-top:10px">“Yok” ve “Geç” kayıtları yönetici onayına düşer (özürlü / özürsüz).</p>
      </div>`;
    function drawAtt(){
      const cid=val("aClass");
      const list=cache.students.filter(s=>s.classId===cid);
      document.getElementById("attList").innerHTML = list.map(s=>`
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)">
          <span>${esc(s.name)} <small style="color:var(--muted)">No ${esc(s.number)}</small></span>
          <select data-sid="${s.id}" style="padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:#0d1524;color:var(--text)">
            <option value="var">Var</option>
            <option value="yok">Yok</option>
            <option value="gec">Geç</option>
            <option value="izinli">İzinli</option>
          </select>
        </div>`).join("") || `<p class="empty">Öğrenci yok</p>`;
    }
    document.getElementById("aClass").onchange=drawAtt;
    drawAtt();
    document.getElementById("saveAtt").onclick = async () => {
      const date=val("aDate")||today();
      const sels=[...document.querySelectorAll("#attList select[data-sid]")];
      const btn=document.getElementById("saveAtt");
      btn.disabled=true; btn.textContent="Kaydediliyor…";
      try{
        for(const sel of sels){
          const studentId=sel.getAttribute("data-sid");
          const status=sel.value;
          const review = (status==="yok"||status==="gec") ? "pending" : "none";
          await addDoc(collection(db,"attendance"), {
            studentId, date, status, review,
            teacherId: current.id,
            teacherName: current.name,
            createdAt: serverTimestamp()
          });
        }
        alert("Yoklama kaydedildi.");
      }catch(e){ alert(e.message||e); }
      btn.disabled=false; btn.textContent="Yoklamayı kaydet";
    };
  }
  else if(page==="announcements") renderAnnouncements(false);
}

function renderStudent(){
  const myGrades = cache.grades.filter(g=>g.studentId===current.id);
  const byLesson = {};
  myGrades.forEach(g=>{
    const k=g.lesson||"Diğer";
    if(!byLesson[k]) byLesson[k]=[];
    byLesson[k].push(g.score);
  });
  const lessonAvgs = Object.entries(byLesson).map(([lesson, scores])=>{
    const avg = scores.reduce((a,b)=>a+b,0)/scores.length;
    return { lesson, avg: Math.round(avg*10)/10, count: scores.length };
  });
  const overall = lessonAvgs.length
    ? Math.round((lessonAvgs.reduce((s,x)=>s+x.avg,0)/lessonAvgs.length)*10)/10
    : null;

  const myAtt = cache.attendance.filter(a=>a.studentId===current.id);

  if(page==="dashboard"){
    mainArea.innerHTML = `
      <div class="grid">
        <div class="stat"><div class="n">${overall ?? "—"}</div><div class="l">Genel ortalama</div></div>
        <div class="stat"><div class="n">${myGrades.length}</div><div class="l">Not kaydı</div></div>
        <div class="stat"><div class="n">${myAtt.filter(a=>a.review==="ozursuz").length}</div><div class="l">Özürsüz yok</div></div>
        <div class="stat"><div class="n">${myAtt.filter(a=>a.review==="ozurlu").length}</div><div class="l">Özürlü yok</div></div>
      </div>
      <div class="card"><h2>${esc(current.name)}</h2>
        <p>Sınıf: <strong>${esc(classLabel(current.classId))}</strong> · No: <strong>${esc(current.number)}</strong></p>
      </div>
      <div class="card"><h2>Ders ortalamaları</h2>
        <div class="table-wrap"><table><thead><tr><th>Ders</th><th>Ortalama</th><th>Not sayısı</th></tr></thead>
        <tbody>${lessonAvgs.map(x=>`<tr><td>${esc(x.lesson)}</td><td><strong>${x.avg}</strong></td><td>${x.count}</td></tr>`).join("")
          || `<tr><td colspan="3" class="empty">Henüz not yok</td></tr>`}
        </tbody></table></div>
      </div>`;
  }
  else if(page==="myGrades"){
    mainArea.innerHTML = `
      <div class="card"><h2>Notlarım (anlık)</h2>
        <div class="table-wrap"><table><thead><tr><th>Ders</th><th>Tür</th><th>Not</th><th>Tarih</th><th>Öğretmen</th></tr></thead>
        <tbody>${myGrades.slice().reverse().map(g=>`<tr>
          <td>${esc(g.lesson)}</td><td>${esc(g.type)}</td><td><strong>${g.score}</strong></td>
          <td>${esc(g.date||"")}</td><td>${esc(g.teacherName||"")}</td>
        </tr>`).join("")||`<tr><td colspan="5" class="empty">Not yok</td></tr>`}
        </tbody></table></div>
      </div>`;
  }
  else if(page==="myAttendance"){
    mainArea.innerHTML = `
      <div class="card"><h2>Devamsızlık (yönetici onaylı)</h2>
        <div class="table-wrap"><table><thead><tr><th>Tarih</th><th>Durum</th><th>Sonuç</th></tr></thead>
        <tbody>${myAtt.slice().reverse().map(a=>{
          let badge = `<span class="badge b-var">${esc(a.status)}</span>`;
          if(a.review==="ozurlu") badge = `<span class="badge b-ozurlu">Özürlü</span>`;
          if(a.review==="ozursuz") badge = `<span class="badge b-ozursuz">Özürsüz</span>`;
          if(a.review==="pending") badge = `<span class="badge b-bekle">Onay bekliyor</span>`;
          return `<tr><td>${esc(a.date)}</td><td>${esc(a.status)}</td><td>${badge}</td></tr>`;
        }).join("")||`<tr><td colspan="3" class="empty">Kayıt yok</td></tr>`}
        </tbody></table></div>
      </div>`;
  }
  else if(page==="announcements") renderAnnouncements(false);
}

function renderAnnouncements(canPost){
  mainArea.innerHTML = `
    ${canPost ? `<div class="card"><h2>Duyuru</h2>
      <div class="field"><label>Başlık</label><input id="nTitle"></div>
      <div class="field"><label>Metin</label><textarea id="nText" rows="3"></textarea></div>
      <button type="button" class="btn btn-sm" id="addAnn">Yayınla</button>
    </div>` : ""}
    <div class="card"><h2>Duyurular</h2>
      ${cache.announcements.map(n=>`
        <div style="padding:12px 0;border-bottom:1px solid var(--line)">
          <strong>${esc(n.title)}</strong>
          <div style="font-size:.78rem;color:var(--muted);margin-top:4px">${esc(n.date||"")}</div>
          <div style="font-size:.85rem;margin-top:6px;color:var(--muted)">${esc(n.text||"")}</div>
        </div>`).join("") || `<p class="empty">Duyuru yok</p>`}
    </div>`;
  const btn=document.getElementById("addAnn");
  if(btn) btn.onclick = async () => {
    const title=val("nTitle"), text=val("nText");
    if(!title||!text) return alert("Eksik");
    await addDoc(collection(db,"announcements"), { title, text, date: today(), by: current.username||current.name, createdAt: serverTimestamp() });
  };
}

/* ——— Events ——— */
document.querySelectorAll(".tab").forEach(tab=>{
  tab.onclick = () => {
    document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
    tab.classList.add("active");
    const mode=tab.getAttribute("data-mode");
    document.getElementById("staffForm").classList.toggle("hidden", mode!=="staff");
    document.getElementById("vbsForm").classList.toggle("hidden", mode!=="vbs");
    document.getElementById("loginAlert").classList.add("hidden");
  };
});

document.getElementById("staffForm").onsubmit = async (e) => {
  e.preventDefault();
  const btn=e.target.querySelector("button[type=submit]");
  btn.disabled=true;
  try{
    const u = await loginStaff(val("staffUser"), val("staffPass"));
    current = u;
    setSession(u);
    page="dashboard";
    showApp();
  }catch(err){
    setAlert(err.message||String(err), false);
  }
  btn.disabled=false;
};

document.getElementById("vbsForm").onsubmit = async (e) => {
  e.preventDefault();
  const btn=e.target.querySelector("button[type=submit]");
  btn.disabled=true;
  try{
    const u = await loginVbs(val("vbsName"), val("vbsClass"), val("vbsNo"));
    current = u;
    setSession(u);
    page="dashboard";
    showApp();
  }catch(err){
    setAlert(err.message||String(err), false);
  }
  btn.disabled=false;
};

document.getElementById("logoutBtn").onclick = () => { setSession(null); showLogin(); };
document.getElementById("menuToggle").onclick = () => sideNav.classList.toggle("open");

/* boot */
(async function(){
  try{
    // connectivity check
    await getDocs(collection(db,"classes"));
  }catch(e){
    boot.innerHTML = `<div style="max-width:420px;text-align:center;padding:20px">
      <p style="color:#fca5a5;margin-bottom:10px">Firestore bağlantı / izin hatası</p>
      <p style="font-size:.8rem;line-height:1.5">Firebase Console → Firestore → Rules kısmını geçici olarak test moduna alın (allow read,write: if true). Sonra sayfayı yenileyin.</p>
      <p style="font-size:.75rem;margin-top:12px;color:#94a3b8">${esc(e.message||e)}</p>
      <button type="button" class="btn" style="margin-top:14px" onclick="location.reload()">Yenile</button>
    </div>`;
    return;
  }
  const s = getSession();
  if(s){
    current = s;
    showApp();
  } else {
    showLogin();
  }
})();
